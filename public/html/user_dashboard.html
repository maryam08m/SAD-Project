<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کاربری - باروک</title>
    
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/user_dashboard.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2&family=Kay+Pho+Du&family=Playfair+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <header>
        <nav class="navbar">
            <a class="navbar-logo" href="main.html">
                <img src="../images/Logo-and-SVGs/BAROQUE.svg" alt="باروک" width="40px" style="margin-top: 5px;">
            </a>

            <ul class="navbar-nav">
                <li class="nav-item"><a href="main.html" class="nav-link">خانه</a></li>
                <li class="nav-item dropdown">
                    <a href="#" class="nav-link">محصولات</a>
                    <div class="dropdown-menu">
                        <a href="product1.html" class="dropdown-item">گردن‌بند</a>
                        <a href="product2.html" class="dropdown-item">دست‌بند</a>
                        <a href="product3.html" class="dropdown-item">انگشتر</a>
                    </div>
                </li>
                <li class="nav-item"><a href="sizeguide.html" class="nav-link">راهنمای سایز</a></li>
                <li class="nav-item"><a href="contactus.html" class="nav-link">تماس با ما</a></li>

                <div class="nav-icon">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="جستجو..." onkeypress="handleEnter(event)">
                        <button onclick="performSearch()">
                            <img src="../images/Logo-and-SVGs/Search.svg" alt="Search" width="20px">
                        </button>
                    </div>

                    <button class="nav-button" id="theme-toggle" title="تغییر تم">
                        <i class="fas fa-moon"></i>
                    </button>

                    <li class="nav-item">
                        <a href="admin.html" class="admin-icon" title="پنل مدیریت"><i class="fas fa-user-shield"></i></a>
                    </li>
                    <li class="nav-item">
                        <a href="user_dashboard.html" class="nav-link active-link" title="حساب کاربری">
                            <img src="../images/Logo-and-SVGs/account.svg" alt="حساب کاربری" height="30px">
                        </a>
                    </li>
                    <li class="nav-item">
                        <button class="nav-button" onclick="window.location.href='cart.html'" title="سبد خرید">
                            <img src="../images/Logo-and-SVGs/shopping-cart.svg" alt="سبد خرید" height="30px">
                        </button>
                    </li>
                </div>
            </ul>
        </nav>
    </header>

    <div class="dashboard-container">
        <div class="dashboard-sidebar">
            <div class="user-welcome">
                <img src="../images/Logo-and-SVGs/account.svg" alt="User" class="user-avatar">
                <h3 id="welcome-name">کاربر عزیز</h3>
            </div>
            <ul class="sidebar-menu">
                <li onclick="showTab('profile')" class="active-tab"><i class="fas fa-user-edit"></i> ویرایش پروفایل</li>
                <li onclick="showTab('orders')"><i class="fas fa-shopping-bag"></i> سفارش‌های من</li>
                <li onclick="logoutUser()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</li>
            </ul>
        </div>

        <div class="dashboard-content">
            
            <div id="profile-tab" class="tab-content active-content">
                <h2>ویرایش اطلاعات کاربری</h2>
                <form id="profile-form" onsubmit="updateProfile(event)">
                    <div class="form-group">
                        <label>نام کامل</label>
                        <input type="text" id="edit-name" required>
                    </div>
                    <div class="form-group">
                        <label>ایمیل (غیر قابل تغییر)</label>
                        <input type="email" id="edit-email" disabled>
                    </div>
                    <div class="form-group">
                        <label>تغییر رمز عبور (اختیاری)</label>
                        <input type="password" id="edit-password" placeholder="رمز عبور جدید">
                    </div>
                    <button type="submit" class="save-btn">ذخیره تغییرات</button>
                </form>
                <p id="update-message"></p>
            </div>

            <div id="orders-tab" class="tab-content">
                <h2>سفارش‌های من</h2>
                <div id="orders-list">
                    <p>در حال بارگذاری...</p>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="brand">
                <img src="../images/Logo-and-SVGs/BAROQUE.svg" alt="باروک" class="footer-logo" height="155px">
            </div>
            <div class="categories">
                <ul>
                    <li><a href="main.html">خانه</a></li>
                    <li><a href="product1.html">گردن‌بند</a></li>
                    <li><a href="product2.html">دست‌بند</a></li>
                </ul>
            </div>
        </div>
    </footer>

    <script src="../js/app.js"></script>
    <script>
        // Check Login on Load
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = 'account.html'; // Redirect if not logged in
            } else {
                document.getElementById('welcome-name').innerText = user.full_name || 'کاربر گرامی';
                document.getElementById('edit-name').value = user.full_name || '';
                document.getElementById('edit-email').value = user.email || '';
                loadUserOrders(user.id);
            }
        });

        // Tab Switching Logic
        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.sidebar-menu li').forEach(el => el.classList.remove('active-tab'));
            
            document.getElementById(tabName + '-tab').style.display = 'block';
            event.currentTarget.classList.add('active-tab');
        }
    </script>
</body>
</html>
